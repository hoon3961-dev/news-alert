name: 중수청 뉴스 알림

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      audio_test:
        description: "음성 브리핑 지금 시험 발송"
        type: boolean
        default: false
      digest_test:
        description: "공소청·형사사법 모음 지금 시험 발송(대기 중인 기사)"
        type: boolean
        default: false
      find_chats:
        description: "부서 채널 번호 찾기(봇이 들어간 대화방 목록을 기록에 출력)"
        type: boolean
        default: false
      brief_file:
        description: "Claude가 쓴 브리핑 원고 파일(briefs/*.json) — 음성·카드만 만들어 발송"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: news-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 최신 발송 기록 받기
        run: git pull --ff-only origin main || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 기사 수집·요약·발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SHARE_CHAT_ID: ${{ secrets.TELEGRAM_SHARE_CHAT_ID || '-1005699213949' }}   # 부서 채널 '중수청 언론보도 알림'(번호만으로는 글을 올리거나 들어올 수 없음)
          FIND_CHATS: ${{ inputs.find_chats }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          DIGEST_MINUTES: ${{ vars.DIGEST_MINUTES }}
          DIGEST_TIMES: ${{ vars.DIGEST_TIMES }}
          DIGEST_STYLE: ${{ vars.DIGEST_STYLE }}
          DIGEST_TEST: ${{ inputs.digest_test }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          EXCLUDE_PRESS: ${{ vars.EXCLUDE_PRESS }}
          EXCLUDE_WORDS: ${{ vars.EXCLUDE_WORDS }}
          QUERIES: ${{ vars.QUERIES }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
          NAVER_SEARCH: ${{ vars.NAVER_SEARCH }}
          NAVER_QUERIES: ${{ vars.NAVER_QUERIES }}
          AUDIO: ${{ vars.AUDIO }}
          AUDIO_TIMES: ${{ vars.AUDIO_TIMES }}
          AUDIO_VOICE: ${{ vars.AUDIO_VOICE }}
          AUDIO_FORMAT: ${{ vars.AUDIO_FORMAT }}
          AUDIO_BGM: ${{ vars.AUDIO_BGM }}
          AUDIO_BGM_STYLE: ${{ vars.AUDIO_BGM_STYLE }}
          AUDIO_BGM_URL: ${{ vars.AUDIO_BGM_URL }}
          AUDIO_RATE: ${{ vars.AUDIO_RATE }}
          AUDIO_DICT: ${{ vars.AUDIO_DICT }}
          AUDIO_PAUSE: ${{ vars.AUDIO_PAUSE }}
          AUDIO_SCRIPT_MSG: ${{ vars.AUDIO_SCRIPT_MSG }}
          AUDIO_SPLIT: ${{ vars.AUDIO_SPLIT }}
          AUDIO_SENT_GAP: ${{ vars.AUDIO_SENT_GAP }}
          AUDIO_PARA_GAP: ${{ vars.AUDIO_PARA_GAP }}
          AUDIO_COMMA_GAP: ${{ vars.AUDIO_COMMA_GAP }}
          AUDIO_TEST: ${{ inputs.audio_test }}
          BRIEF_FILE: ${{ inputs.brief_file }}
          BRIEF_FALLBACK_MIN: ${{ vars.BRIEF_FALLBACK_MIN }}
          CARD: ${{ vars.CARD }}
          CARD_MAX: ${{ vars.CARD_MAX }}
          VERIFY: ${{ vars.VERIFY }}
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL }}
          BRIEF_MODE: ${{ vars.BRIEF_MODE }}
          WRITE_MODEL: ${{ vars.WRITE_MODEL }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: python news_alert.py

      - name: 발송 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f seen.json ] || exit 0
          cp seen.json "$RUNNER_TEMP/mine.json"
          [ -f state.json ] && cp state.json "$RUNNER_TEMP/state.json"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - "$RUNNER_TEMP/mine.json" <<'EOF'
          import json, sys
          mine = json.load(open(sys.argv[1], encoding="utf-8"))
          try:
              theirs = json.load(open("seen.json", encoding="utf-8"))
          except Exception:
              theirs = {}
          theirs.update(mine)
          json.dump(theirs, open("seen.json", "w", encoding="utf-8"), ensure_ascii=False, indent=0, sort_keys=True)
          EOF
            [ -f "$RUNNER_TEMP/state.json" ] && cp "$RUNNER_TEMP/state.json" state.json && git add state.json
            git add seen.json
            git diff --cached --quiet && exit 0
            git commit -m "발송 기록 갱신 [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
