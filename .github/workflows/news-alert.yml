name: 중수청 뉴스 알림

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 최신 발송 기록 받기
        run: git pull --ff-only origin main || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 기사 수집·요약·발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          EXCLUDE_PRESS: ${{ vars.EXCLUDE_PRESS }}
          EXCLUDE_WORDS: ${{ vars.EXCLUDE_WORDS }}
          QUERIES: ${{ vars.QUERIES }}
        run: python news_alert.py

      - name: 발송 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f seen.json ] || exit 0
          cp seen.json "$RUNNER_TEMP/mine.json"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - "$RUNNER_TEMP/mine.json" <<'EOF'
          import json, sys
          mine = json.load(open(sys.argv[1], encoding="utf-8"))
          try:
              theirs = json.load(open("seen.json", encoding="utf-8"))
          except Exception:
              theirs = {}
          theirs.update(mine)
          json.dump(theirs, open("seen.json", "w", encoding="utf-8"), ensure_ascii=False, indent=0, sort_keys=True)
          EOF
            git add seen.json
            git diff --cached --quiet && exit 0
            git commit -m "발송 기록 갱신 [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
